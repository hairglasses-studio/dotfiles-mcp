name: CI

# Deprecated automation surface: local CI is canonical. This compatibility
# workflow is intentionally manual-only.
on:
  workflow_dispatch:

jobs:
  test:
    uses: hairglasses-studio/.github/.github/workflows/mcp-test.yml@main
    with:
      go-version: "1.26.1"
      cgo-enabled: true
      cgo-cflags: "-DSQLITE_ENABLE_FTS5"
      cgo-ldflags: "-lm"
      install-system-deps: "libsqlite3-dev"
